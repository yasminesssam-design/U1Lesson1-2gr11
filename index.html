body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}

.tabs{display:flex;gap:8px}.tabs .btn{margin:8px 0;font-size:16px;padding:12px}

1:{n:"الدرس الأول",t:"Development of IT and Social Transformation | تطور تكنولوجيا المعلومات والتحول الاجتماعي",
ex:[
["١) تاريخ تكنولوجيا المعلومات (IT)","<p>التكنولوجيا لم تظهر مرة واحدة، بل تطورت على مراحل، وكل مرحلة غيّرت طريقة التواصل والعمل والتعلم والدفع والتجارة.</p><ul><li><b>1940s–1960s:</b> ظهور الحواسيب مثل <span class='k'>ENIAC</span> (كمبيوتر ضخم يعمل بالصمامات المفرغة <span class='en'>vacuum tubes</span>) واستُخدمت للأغراض العسكرية والعلمية.</li><li><b>1970s–1980s:</b> انتشار الحواسيب الشخصية <span class='k'>PCs</span> فبدأ الأفراد يستخدمون الكمبيوتر.</li><li><b>1990s:</b> انتشار <span class='k'>الإنترنت والويب</span> (Internet & Web) فأصبحت المعلومات عالمية وانتشر البريد الإلكتروني.</li><li><b>2000s:</b> ظهور الهواتف الذكية مثل iPhone وانتشر الإنترنت المحمول بسرعة.</li><li><b>2010s فما بعد:</b> انتشار <span class='k'>الحوسبة السحابية</span> (Cloud computing): تحليل البيانات الضخمة وانتشار الذكاء الاصطناعي، وأصبحت التكنولوجيا <span class='k'>خدمة</span> (IT as a service).</li></ul><p>مثال: طالب في مصر يراسل أصدقاءه، يدفع بتطبيق، يحضر حصة أونلاين، ويطلب كتابًا من متجر إلكتروني. قبل 20 سنة معظم هذا كان مستحيلًا!</p>"],
["٢) قانون مور (Moore's Law)","<p><b>ببساطة:</b> عدد <span class='k'>الترانزستورات</span> (transistors) داخل الشريحة (chip) يتضاعف تقريبًا <b>كل سنتين</b>، فتزداد قوة الحاسوب كثيرًا.</p><p><b>المشكلة:</b> الترانزستورات وصلت لحد فيزيائي في التصغير. عند التصغير تظهر مشكلتان:</p><ul><li><span class='k'>Quantum tunneling</span> (النفق الكمي): الإلكترونات «تتسلل» عبر الحواجز.</li><li><span class='k'>Leakage current</span> (تسرب التيار): يهرب التيار بدون قصد.</li></ul><p>فيصعب الحصول على أداء أعلى وطاقة أقل معًا.</p><p><b>الحلول الجديدة:</b> (1) <span class='k'>المعالجة المتوازية</span> Parallel processing: عدة أنوية (cores) تعمل معًا على مهام مختلفة في نفس الوقت. (2) <span class='k'>الحواسيب الكمية</span> Quantum computers المبنية على ميكانيكا الكم.</p>"],
["٣) كيف غيّرت IT المجتمع","<ul><li><span class='k'>SNS</span> شبكات التواصل الاجتماعي: تربط الناس وتنشر المعلومات بسرعة كبيرة.</li><li><span class='k'>E-commerce (EC)</span> التجارة الإلكترونية: بيع وشراء عبر الإنترنت. مثال: Amazon, eBay.</li><li><span class='k'>Remote work</span> العمل عن بُعد: العمل من المنزل أو أي مكان عبر الإنترنت.</li><li><span class='k'>Online learning</span> التعلم عبر الإنترنت: الدروس والمواد تصلك بالإنترنت.</li><li><span class='k'>Cashless payment</span> الدفع بدون نقد: بطاقات ائتمان، بطاقات خصم، QR، وتطبيقات مثل Instapay.</li></ul>"],
["٤) تقنيات ناشئة (Emerging)","<h2>🚗 القيادة الذاتية Autonomous driving</h2><p>سيارة تقودها AI بدون إنسان، تستخدم كاميرات وحساسات لتفهم ما حولها، تقرر، وتتحكم بالسيارة. التأخير 0.1 ثانية قد يسبب حادثًا، لذلك تستخدم <span class='k'>Edge computing</span>: معالجة البيانات داخل السيارة نفسها فورًا بدل إرسالها للسحابة.</p><h2>🕶️ AR و VR</h2><ul><li><b>AR</b> الواقع المعزز: عالم حقيقي + معلومات رقمية فوقه (يضيف طبقات رقمية).</li><li><b>VR</b> الواقع الافتراضي: عالم افتراضي 100% يحل محل الواقع.</li></ul><h2>⚛️ الحوسبة الكمية Quantum computing</h2><p>تسرّع بشدة الحسابات الصعبة على الحواسيب التقليدية. البت العادي (bit) إما 0 أو 1، أما <span class='k'>Qubit</span> فيستخدم <b>التراكب</b> (superposition): مزيج من 0 و1 معًا.</p>"]
],

Q('t',"VR allows users to immerse themselves in a virtual space generated by a computer.","الواقع الافتراضي VR يتيح للمستخدم الانغماس في فضاء افتراضي من صنع الحاسوب.",TF,0),
Q('t',"Autonomous driving can use cloud computing to process information on the vehicle.","القيادة الذاتية تستخدم الحوسبة السحابية لمعالجة المعلومات على السيارة.",TF,1),
Q('m',"The empirical observation that the number of transistors on a chip doubles about every two years is called ____.","الملاحظة بأن عدد الترانزستورات في الشريحة يتضاعف كل سنتين تقريبًا تسمى ____.",["Moore's Law|قانون مور","Edge computing|حوسبة الحافة","Superposition|التراكب","Parallel processing|المعالجة المتوازية"],0),

2:{n:"الدرس الثاني",t:"How AI Works | كيف يعمل الذكاء الاصطناعي",
ex:[
["١) ما هو الذكاء الاصطناعي (AI)؟","<p>نستخدم AI كل يوم: فلتر البريد المزعج (Spam)، اقتراح المنتجات، تطبيق الترجمة، و ChatGPT الذي يكتب نصًا من أمر (prompt).</p><p><b>AI</b> = مصطلح عام لتقنيات <span class='k'>تحاكي السلوك الذكي للإنسان</span> (التعلم، التفكير، الحكم) على الحاسوب. أمثلة: التعرف على الكلام، التعرف على الصور، الترجمة.</p><p>📌 الذكاء الاصطناعي اليوم <b>ضيق (Narrow)</b>: بارع في مهمة واحدة فقط.</p>"],
["٢) هرم تقنيات الذكاء الاصطناعي","<p>تخيّل دُمى الماتريوشكا (كل واحدة داخل الأخرى):</p><p><b>AI</b> ⊃ <b>Machine Learning</b> ⊃ <b>Deep Learning</b> ⊃ <b>Generative AI</b></p><h2>Machine Learning التعلم الآلي</h2><p>يتعلم <span class='k'>الأنماط من البيانات</span> ليتنبأ ويحكم، ولا يعتمد فقط على قواعد مكتوبة يدويًا. أمثلة: فلتر السبام، اقتراح المنتجات.</p><h2>Deep Learning التعلم العميق</h2><p>نوع متقدم من التعلم الآلي يستخدم <span class='k'>الشبكات العصبية</span> ويتعلم أنماطًا معقدة من بيانات ضخمة. أمثلة: تحليل الصور للسيارات ذاتية القيادة، تركيب الصوت.</p><h2>Neural Network الشبكة العصبية</h2><p>نظام مصمم على شكل خلايا الدماغ العصبية (neurons)، يربط عددًا كبيرًا منها ليتعلم من البيانات. فيها: طبقة مدخلات (Input) ← طبقات مخفية (Hidden) ← طبقة مخرجات (Output).</p><p>📌 مثال: AI يميّز المحاصيل السليمة من المريضة بصور. يحتاج بيانات صور للنوعين، وقد يخطئ إذا رأى شيئًا غير مألوف أو نادرًا في بيانات تدريبه.</p>"],
["٣) الذكاء الاصطناعي التوليدي (Generative AI)","<p>يستخدم التعلم العميق ليُنتج <span class='k'>بيانات جديدة</span>: نصوص، صور، صوت، برامج. أمثلة: ChatGPT وأدوات توليد الصور. أنت تكتب Prompt فيعطيك نصًا أو صورة أو صوتًا.</p>"],
["٤) لماذا يخطئ؟ (الهلوسة Hallucination)","<p>قد يكتب نصًا يبدو صحيحًا لكنه <b>خاطئ فعلًا</b>، وهذا اسمه <span class='k'>Hallucination</span> (هلوسة).</p><p>✅ لذلك لا تعتبر ما يولّده صحيحًا تلقائيًا. عند كتابة تقرير مدرسي، <b>تحقق من المعلومات</b> قبل استخدامها.</p>"]
],
qs:[
Q('m',"Artificial Intelligence (AI) is a general term for technologies that:","الذكاء الاصطناعي مصطلح عام للتقنيات التي:",["store large amounts of data|تخزّن بيانات كبيرة","imitate human performance on a computer|تحاكي أداء الإنسان على الحاسوب","connect computers through the Internet|توصل الحواسيب بالإنترنت","generate images only|تولّد الصور فقط"],1),
Q('m',"Which of the following is an example of AI you learned?","أي مما يلي مثال على AI تعلمته؟",["Speech recognition|التعرف على الكلام","File compression|ضغط الملفات","Cloud storage|التخزين السحابي","Cashless payment|الدفع بدون نقد"],0),
Q('m',"Which technology learns patterns from data to make predictions and judgments?","أي تقنية تتعلم الأنماط من البيانات لتتنبأ وتحكم؟",["Machine learning|التعلم الآلي","Generative AI|الذكاء التوليدي","Computer network|شبكة حاسوب","Fixed-rule programming|برمجة بقواعد ثابتة"],0),
Q('m',"Which statement best describes deep learning?","أي عبارة تصف التعلم العميق؟",["It generates only text.|يولّد النصوص فقط","It follows only fixed hand-written rules.|يتبع قواعد ثابتة فقط","It is an advanced type of machine learning that uses neural networks.|نوع متقدم من التعلم الآلي يستخدم الشبكات العصبية","It is outside artificial intelligence.|خارج الذكاء الاصطناعي"],2),
Q('m',"A neural network is modeled after ____.","الشبكة العصبية مصممة على غرار ____.",["computer memory structure|بنية ذاكرة الحاسوب","the nerve cells of the human brain|الخلايا العصبية في دماغ الإنسان","Internet connections|اتصالات الإنترنت","fixed rules by programmers|قواعد ثابتة من المبرمجين"],1),
Q('m',"Which sequence shows the relationship from the broadest field to the most specialized?","أي تسلسل يوضح العلاقة من الأوسع إلى الأكثر تخصصًا؟",["AI → ML → Deep Learning → Generative AI|AI ← تعلم آلي ← تعلم عميق ← توليدي","AI → Deep Learning → ML → Generative AI|AI ← عميق ← آلي ← توليدي","ML → AI → Generative AI → Deep Learning|آلي ← AI ← توليدي ← عميق","Generative AI → Deep Learning → ML → AI|توليدي ← عميق ← آلي ← AI"],0),

const EN={
1:[
"<p>IT did not appear in one step. It grew through <b>stages</b>, and each stage changed how people <b>communicate, work, learn, pay and do business</b>.</p><ul><li><b>1940s–1960s:</b> The first computers, like <b>ENIAC</b> (ENIAC – الحاسوب الأول), used <b>vacuum tubes</b> (الصمامات المفرغة). Used for <b>military and science</b> (عسكري وعلمي).</li><li><b>1970s–1980s:</b> <b>Personal computers – PCs</b> (الحواسيب الشخصية). Ordinary people started using computers.</li><li><b>1990s:</b> The <b>Internet and the Web</b> (الإنترنت والويب) became commercial. Information became <b>global</b> and <b>email</b> spread.</li><li><b>2000s:</b> <b>Smartphones</b> (الهواتف الذكية), like the iPhone. Mobile Internet spread fast.</li><li><b>2010s onward:</b> <b>Cloud computing</b> (الحوسبة السحابية). Big data analysis and <b>AI</b> spread. <b>IT as a service</b> (التكنولوجيا كخدمة).</li></ul>",
"<p><b>Moore's Law</b> (قانون مور): the number of <b>transistors</b> (الترانزستورات) on a <b>chip</b> (الشريحة) <b>doubles about every 2 years</b> → computers get much more powerful.</p><p><b>Problem:</b> chips are getting so small that they reach a <b>physical limit</b> (حد فيزيائي):</p><ul><li><b>Quantum tunneling</b> (النفق الكمي): electrons slip through barriers.</li><li><b>Leakage current</b> (تسرب التيار): current escapes by accident.</li></ul><p>So it is hard to get more performance and less power together.</p><p><b>New ideas:</b> <b>Parallel processing</b> (المعالجة المتوازية): many <b>cores</b> (الأنوية) work on different tasks at once. <b>Quantum computers</b> (الحواسيب الكمية): based on <b>quantum mechanics</b> (ميكانيكا الكم).</p>",
"<p>IT changed everyday life, not only computers:</p><ul><li><b>SNS – Social Networking Service</b> (شبكات التواصل): connect with people, post and share fast.</li><li><b>E-commerce – EC</b> (التجارة الإلكترونية): buying and selling online. Ex: Amazon, eBay.</li><li><b>Remote work</b> (العمل عن بُعد): work from home or anywhere using the Internet.</li><li><b>Online learning</b> (التعلم عبر الإنترنت): classes and materials come through the Internet.</li><li><b>Cashless payment</b> (الدفع بدون نقد): pay with electronic money or QR codes. Ex: credit cards, debit cards, Instapay.</li></ul>",
"<h3>🚗 Autonomous driving (القيادة الذاتية)</h3><p>A car driven by AI without a human. <b>Cameras and sensors</b> (كاميرات وحساسات) recognize surroundings, decide, and control the car. A 0.1-second delay can cause a crash, so it uses <b>edge computing</b> (حوسبة الحافة): the data is processed <b>inside the car</b>, not sent to the cloud.</p><h3>🕶️ AR and VR</h3><ul><li><b>AR – Augmented Reality</b> (الواقع المعزز): real world + digital information on top.</li><li><b>VR – Virtual Reality</b> (الواقع الافتراضي): 100% virtual world that replaces the real one.</li></ul><h3>⚛️ Quantum computing (الحوسبة الكمية)</h3><p>Speeds up very hard calculations. A <b>classic bit</b> (البت العادي) is 0 <i>or</i> 1. A <b>qubit</b> (الكيوبت) uses <b>superposition</b> (التراكب): 0 <i>and</i> 1 at the same time.</p>"],
2:[
"<p>We use AI daily: a <b>spam filter</b> (فلتر البريد المزعج), product recommendations, translation apps, and ChatGPT.</p><p><b>AI – Artificial Intelligence</b> (الذكاء الاصطناعي): a general term for technology that <b>copies intelligent human behavior</b> (learning, reasoning, judgment) on a computer. Ex: <b>speech recognition</b> (التعرف على الكلام), <b>image recognition</b> (التعرف على الصور), <b>translation</b> (الترجمة).</p><p>📌 Today's AI is <b>narrow</b> (ضيق): expert at <b>one task only</b>.</p>",
"<p>Think of boxes inside boxes (<b>nested categories</b> – فئات متداخلة):</p><p><b>AI ⊃ Machine Learning ⊃ Deep Learning ⊃ Generative AI</b></p><h3>Machine Learning (التعلم الآلي)</h3><p>Learns <b>patterns from data</b> (أنماط من البيانات) to predict and judge. It does not depend only on fixed hand-written rules. Ex: spam filters, product recommendations.</p><h3>Deep Learning (التعلم العميق)</h3><p>An advanced type of machine learning using <b>neural networks</b> (الشبكات العصبية). Learns <b>complex patterns</b> from <b>large-scale data</b>. Ex: image analysis for self-driving cars, speech synthesis.</p><h3>Neural Network (الشبكة العصبية)</h3><p>A system modeled after the brain's <b>nerve cells – neurons</b> (الخلايا العصبية). Simple parts connected in layers: <b>Input layer</b> (المدخلات) → <b>Hidden layers</b> (المخفية) → <b>Output layer</b> (المخرجات).</p><p>📌 Ex: AI can tell healthy crops from diseased ones using photos. It needs <b>image data</b> of both. It may make mistakes with things <b>unfamiliar or rare</b> in its training data.</p>",
"<p><b>Generative AI</b> (الذكاء الاصطناعي التوليدي): uses deep learning to <b>create new data</b>: <b>text, images, audio, programs</b> (نصوص، صور، صوت، برامج). Ex: ChatGPT, image-generation AI. You give a <b>prompt</b> (الأمر) and it gives you the result.</p>",
"<p><b>Hallucination</b> (الهلوسة): when generative AI writes something that <b>sounds correct but is wrong</b>.</p><p>✅ So never treat AI output as automatically true. For a school report, <b>check the information</b> (تحقق من المعلومات) first.</p>"]};
const ET={1:['1) History of Information Technology (IT)',"2) Moore's Law",'3) How IT Changed Society','4) Emerging Technologies'],2:['1) What is Artificial Intelligence (AI)?','2) Hierarchy of AI Technologies','3) Generative AI','4) Why AI Makes Mistakes (Hallucination)']};
const app=document.getElementById('app');let AC;
function snd(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq=ok?[[523,0],[659,.12],[784,.24],[1047,.36]]:[[220,0],[165,.15]];seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.2,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.25);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.28)});if(navigator.vibrate)navigator.vibrate(ok?60:[120,60,120])}catch(e){}}
function flash(c){const f=document.getElementById('fl');f.style.background=c;f.classList.remove('a');void f.offsetWidth;f.classList.add('a')}
function conf(){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','⭐','✨','🎊'][i%4];s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
const sp=s=>{const [e,a]=s.split('|');return `<span>${e}</span><small>${a}</small>`};

function home(){app.innerHTML=`<h1 style="direction:ltr">📘 Programming & AI<br><small style="color:var(--mu)">البرمجة والذكاء الاصطناعي – الصف الثاني الثانوي</small></h1><button class="btn" onclick="lesson(1)">📗 Lesson 1 | الدرس الأول</button><button class="btn" onclick="lesson(2)">📙 Lesson 2 | الدرس الثاني</button>`}
function lesson(n,tab='ex'){const d=L[n];let h=`<button class="btn s" style="width:auto;padding:8px 16px;font-size:14px" onclick="home()">→ Home | الرئيسية</button><h1 style="direction:ltr">${d.t.split(' | ')[0]}</h1><div style="text-align:center;color:var(--mu)">${d.n} – ${d.t.split(' | ')[1]}</div><div class="tabs"><button class="btn ${tab=='ex'?'':'s'}" onclick="lesson(${n},'ex')">📖 Explain | الشرح</button><button class="btn ${tab=='q'?'':'s'}" onclick="quiz(${n})">📝 Quiz | الأسئلة (${d.qs.length})</button></div>`;
if(tab=='ex')h+=d.ex.map((e,k)=>`<div class="card"><div class="eg"><h2>${ET[n][k]}</h2>${EN[n][k]}</div><div class="ar"><h3>🇪🇬 الترجمة بالعربي</h3><h2>${e[0]}</h2>${e[1]}</div></div>`).join('')+`<button class="btn" onclick="quiz(${n})">Start the quiz ← ابدأ الأسئلة</button>`;
app.innerHTML=h;scrollTo(0,0)}
let S;
function quiz(n){S={n,i:0,sc:0,done:false};showQ()}
function showQ(){const d=L[S.n],q=d.qs[S.i],N=d.qs.length;S.ans=false;
const lab={m:'Choose the correct answer | اختر الإجابة الصحيحة',t:'True or False | صح أم خطأ'}[q.t];
app.innerHTML=`<button class="btn s" style="width:auto;padding:8px 16px;font-size:14px" onclick="lesson(${S.n})">→ Back | العودة للشرح</button><div class="bar"><i style="width:${S.i/N*100}%"></i></div><p>Question ${S.i+1} / ${N} | سؤال · ✅ ${S.sc}</p><div class="card" id="qc"><small class="k">${lab}</small><h2 style="color:inherit;direction:ltr;text-align:left">${q.en}</h2><div style="color:var(--mu);margin-bottom:6px">${q.ar}</div>${q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${sp(o)}</button>`).join('')}</div><div id="nx"></div>`;scrollTo(0,0)}
function pick(j){if(S.ans)return;S.ans=true;const q=L[S.n].qs[S.i],b=document.querySelectorAll('.opt'),qc=document.getElementById('qc');
b.forEach(x=>x.disabled=true);b[q.a].classList.add('ok');
if(j==q.a){S.sc++;snd(true);flash('#5a9c82');conf();qc.classList.add('pop')}else{b[j].classList.add('no');snd(false);flash('#c47a72');qc.classList.add('shake')}
const last=S.i==L[S.n].qs.length-1;
document.getElementById('nx').innerHTML=`<div class="card">${j==q.a?'🎉 Correct! | إجابة صحيحة':'❌ Wrong | إجابة خاطئة – الصحيح بالأخضر'}</div><button class="btn" onclick="${last?'fin()':'nxt()'}">${last?'See result | عرض النتيجة':'Next | التالي ←'}</button>`}
function nxt(){S.i++;showQ()}
function fin(){const d=L[S.n],N=d.qs.length,p=Math.round(S.sc/N*100);snd(p>=50);if(p>=50)conf();
app.innerHTML=`<div class="card"><div class="big">${p>=80?'🏆':p>=50?'👍':'💪'}</div><h1>Score: ${S.sc} / ${N} (${p}%)<br><small>نتيجتك: ${S.sc} من ${N}</small></h1><p style="text-align:center">${d.n}</p><input id="nm" placeholder="اكتب اسمك | Your name"><button class="btn" style="background:#5a9c82" onclick="wa()">📲 Send via WhatsApp | إرسال على واتساب</button><button class="btn s" onclick="quiz(${S.n})">🔄 Retry | إعادة</button><button class="btn s" onclick="home()">Home | الرئيسية</button></div>`}
function wa(){const N=L[S.n].qs.length,nm=document.getElementById('nm').value.trim()||'طالب';
const t=`نتيجة ${L[S.n].n} (${L[S.n].t.split(' | ')[0]})\nالطالب: ${nm}\nالدرجة: ${S.sc} من ${N} (${Math.round(S.sc/N*100)}%)`;
window.open('https://wa.me/201099920517?text='+encodeURIComponent(t),'_blank')}
home();
</script></body></html>
